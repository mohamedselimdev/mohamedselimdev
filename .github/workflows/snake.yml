name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f6bff&color_dots=#e7edf9,#bcd3ff,#82b0ff,#3d86ff,#1f6bff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3da5ff&color_dots=#0b1428,#0f3a8f,#1850c4,#1f6bff,#3da5ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
